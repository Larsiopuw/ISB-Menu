/* ISB porcelain and brushed metal; orange navigation accents. */
:root{--bg:#e6e9ee;--panel:#f5f7fa;--card:#fff;--line:#d8dee6;--text:#202834;--muted:#667382;--accent:#e17027}
body{color:var(--text);background:#a3acb6;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.scene{filter:none;opacity:.6;background:radial-gradient(ellipse at 50% 35%,#dce1e8 0,transparent 65%),linear-gradient(155deg,#64717e,#b9c2cb 60%,#798594)}
.caption{color:#253142}.caption strong{color:#202834;letter-spacing:-.6px}.caption span{color:#4a596c}
.workspace{bottom:18px}.panel{background:linear-gradient(160deg,#ffffffed,#eef1f6f5);border:1px solid #fff8;box-shadow:0 24px 80px #16273938,inset 0 1px #fff;backdrop-filter:blur(26px);border-radius:26px}
.panel.closed{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(18px) scale(.94);transition:opacity .24s,transform .32s,visibility 0s .32s}
.panel:not(.closed){visibility:visible;transition:opacity .24s,transform .32s cubic-bezier(.22,1,.36,1),visibility 0s}
.header{border-bottom:1px solid #dce2e880;height:55px}.header h1{flex:1;font-weight:650;letter-spacing:-.35px}.header svg{color:var(--accent)}
.window-button{background:#e0e5ec70;color:#697583;border-radius:50%}.window-button:hover{background:#d5dce5}
.search{background:#e4e9ef8c;border:1px solid #fff9;border-radius:12px}.search input{color:var(--text)}
.content{scrollbar-color:#c7cfd9 transparent}.card,.tile{background:linear-gradient(135deg,#ffffffec,#ffffff85);border:1px solid #fff9;box-shadow:0 2px 4px #182e4b05;border-radius:17px}
.tile-head{color:#697789}.tile-head svg{color:var(--accent)}.tile strong{letter-spacing:-.3px}.tile small,.card p{color:var(--muted)}
.pill{background:#e0e6ee;color:#3e4b5c;border:1px solid #ffffff70;font-weight:550;border-radius:12px}.pill:hover{background:#d4dce7}.pill.active,.tuner-tabs .active{background:var(--accent);color:white}
.quick button{background:#fff9;border:1px solid #fff9;box-shadow:0 2px 4px #182e4b05;border-radius:17px}.quick button.active{background:#fff0e5;border-color:#edc29e}.quick .dot{background:#cdd5de}.quick svg{color:var(--accent)}
.tuner-tabs .reset{background:#e0e6ee}.range{accent-color:var(--accent)}.range::-webkit-slider-thumb{background:white;box-shadow:0 2px 6px #39495e40;border:1px solid #d0d8e2}.ruler{opacity:.45}.value{color:var(--accent)}
.toggle{background:#cbd4df}.toggle:before{background:white;box-shadow:0 2px 4px #24344c22}.toggle.on{background:var(--accent)}.favorite{color:#c4cdd7;padding:6px;top:10px;border-radius:10px}.favorite:hover{background:#e1702710;color:var(--accent)}.favorite.on{color:var(--accent)}
.dock{border-radius:28px;background:linear-gradient(140deg,#ffffffdc,#e9edf3ed);border:1px solid #fff9;box-shadow:0 12px 40px #14243e30,inset 0 1px #fff;backdrop-filter:blur(28px)}
.time{font-size:12px;color:#566375}.nav button{background:transparent;color:#6b7989}.nav button:hover{background:#ffffff90;color:#313e4f;transform:translateY(-3px) scale(1.06)}.nav button.selected{background:#e1702715;color:var(--accent)}
.profile{background:linear-gradient(140deg,#f4d5bc,#e5ae87);border:2px solid white;color:#6b3b18;box-shadow:0 2px 6px #29395118}
.nav button span.nav-tooltip{background:linear-gradient(130deg,#ffffffed,#edf1f7ed);color:var(--text);border:1px solid #fff9;box-shadow:0 10px 30px #14243e22;backdrop-filter:blur(25px);visibility:hidden;transition:opacity .18s,transform .24s,visibility 0s .24s}
.nav button:hover span.nav-tooltip{visibility:visible;transition-delay:.12s,.12s,0s}.nav-tooltip svg{color:var(--accent)}.nav-tooltip small{color:var(--muted)}
.status-bar{position:fixed;top:18px;right:18px;height:44px;display:flex;align-items:center;gap:20px;padding:0 18px;border-radius:22px;background:linear-gradient(140deg,#ffffffdd,#e8edf5eb);border:1px solid #fff9;backdrop-filter:blur(25px);box-shadow:0 7px 24px #1929401a;font-size:11px;font-weight:550;font-variant-numeric:tabular-nums}.status-bar b{color:var(--accent);letter-spacing:1px}.status-bar span+span{border-left:1px solid #d3dbe5;padding-left:16px}

.notice,.quick-overlay,.island{background:linear-gradient(135deg,#ffffffeb,#eef2f8ed);border:1px solid #fff9;color:var(--text);backdrop-filter:blur(25px);box-shadow:0 16px 50px #14243e2a}.notice small{color:var(--muted)}.notice svg{color:var(--accent)}
.quick-top input{color:var(--text)}.quick-top input::placeholder{color:var(--muted)}.quick-top button,.quick-footer button{background:#e0e6ee;color:#59687c}.quick-footer button.active{background:#e1702718;color:#ba5a20}.quick-footer small{color:var(--muted)}
.field,.code{background:#e5eaf2;color:var(--text);border-color:white}.script-grid button,.setting-grid button{background:linear-gradient(140deg,#ffffffdb,#e7edf5bf);border:1px solid #fff9}.setting-grid button:hover{background:#fff}.script-grid strong,.setting-grid strong{color:var(--text)}
.island button{color:var(--text)}.launcher{display:none}@media(max-width:640px){.status-bar{top:12px;right:12px;gap:12px;padding:0 12px}.caption{display:none}}

function updateFlightHud(){flightTier=Math.max(1,Math.min(4,Math.round(values.Flight)));$('.flight-hud').hidden=!on.has('fly');if(!on.has('fly'))$('#flight-styles').hidden=true;$('#flight-info').textContent='ISB FLUG · '+['GLIDE','NORMAL','FAST','TURBO'][flightTier-1]+' · '+([55,110,140,250][flightTier-1])+' studs/s';$('#flight-tier').textContent=bindings.flightTierKey.replace('Key','')+' · '+flightTier+'/4'}
function cycleTier(){values.Flight=flightTier%4+1;updateFlightHud();uiTone('tap')}
$('#flight-tier').onclick=cycleTier;
const flightStyles=['Fly','Mysterious','Villain Fly','Superman','Halloween Fly'];
$('#flight-styles').innerHTML=flightStyles.map(name=>`<button data-flight-style="${name}">${name}</button>`).join('');
$('#flight-style').onclick=()=>{const open=$('#flight-styles').hidden;$('#flight-styles').hidden=!open;$('#flight-style').setAttribute('aria-expanded',String(open))};
$('#flight-styles').onclick=e=>{const b=e.target.closest('[data-flight-style]');if(!b)return;flightStyle=b.dataset.flightStyle;$('#flight-style').textContent=flightStyle;$('#flight-styles').hidden=true;$('#flight-style').setAttribute('aria-expanded','false')};
document.addEventListener('click',e=>{if(!e.target.closest('.flight-hud')){$('#flight-styles').hidden=true;$('#flight-style').setAttribute('aria-expanded','false')}});

$('#voice-mic').innerHTML=icon('microphone');$('#voice-mic').onclick=()=>{const muted=$('#voice-mic').classList.toggle('muted');$('#voice-mic').title=muted?'Mikrofon stumm · Einschalten':'Mikrofon an · Stummschalten';$('#voice-mic').setAttribute('aria-label',muted?'Mikrofon einschalten':'Mikrofon stummschalten');toast(muted?'Mikrofon stummgeschaltet.':'Mikrofon freigegeben.','Mikrofon · Vorschau')};
let rpTarget='',rpAction='';
$('#roleplay-search').oninput=e=>{let count=0;document.querySelectorAll('[data-search]').forEach(b=>{b.hidden=!b.dataset.search.includes(e.target.value.toLowerCase());if(!b.hidden)count++});$('#roleplay-empty').hidden=count>0};
function alignRoleplay(){document.documentElement.style.setProperty('--status-width',$('.status-bar').getBoundingClientRect().width+'px')}
$('#status-roleplay').onclick=()=>{$('.roleplay-panel').hidden=!$('.roleplay-panel').hidden;alignRoleplay();uiTone($('.roleplay-panel').hidden?'close':'open')};
$('#roleplay-close').onclick=()=>$('.roleplay-panel').hidden=true;
$('#roleplay-target').onclick=()=>$('.roleplay-targets').hidden=!$('.roleplay-targets').hidden;
document.querySelectorAll('[data-rp-target]').forEach(b=>b.onclick=()=>{rpTarget=b.dataset.rpTarget;$('#roleplay-target').textContent=rpTarget||'Automatisch · Nächster Spieler';$('.roleplay-targets').hidden=true});
document.querySelectorAll('[data-rp-action]').forEach(b=>b.onclick=()=>{const target=rpTarget||'Diaqon';if(!rpTarget)$('#roleplay-target').textContent='Automatisch · '+target;rpAction=b.dataset.rpAction;$('#roleplay-state').textContent=rpAction+' · '+target;document.querySelectorAll('[data-rp-action]').forEach(x=>x.classList.toggle('active',x===b))});
$('#roleplay-stop').onclick=()=>{rpAction='';$('#roleplay-state').textContent='Bereit · Aktion auswählen';document.querySelectorAll('[data-rp-action]').forEach(x=>x.classList.remove('active'))};
window.addEventListener('resize',alignRoleplay);
function persistPreview(){try{localStorage.setItem('ISBPreview-v23',JSON.stringify({alignment,previewNotifications,previewSounds,previewAutoOpen,provider,discovery,favorites:[...favorites],scripts:[...scriptFavorites],values,bindings,accent:document.documentElement.style.getPropertyValue('--accent')}))}catch{}}
try{const saved=JSON.parse(localStorage.getItem('ISBPreview-v23')||'null');if(saved){alignment=saved.alignment||'Center';previewNotifications=saved.previewNotifications!==false;previewSounds=saved.previewSounds!==false;previewAutoOpen=saved.previewAutoOpen!==false;provider=saved.provider||provider;discovery=saved.discovery||discovery;(saved.favorites||[]).forEach(x=>favorites.add(x));(saved.scripts||[]).forEach(x=>scriptFavorites.add(x));Object.assign(values,saved.values||{});Object.assign(bindings,saved.bindings||{});if(saved.accent)document.documentElement.style.setProperty('--accent',saved.accent)}}catch{}
document.addEventListener('click',()=>setTimeout(persistPreview,0));document.addEventListener('input',persistPreview);window.addEventListener('keyup',persistPreview);
let lastHoverTone=0;
document.addEventListener('pointerover',e=>{const b=e.target.closest('button');if(!b||b.contains(e.relatedTarget))return;const now=performance.now();if(now-lastHoverTone>85){lastHoverTone=now;uiTone('hover')}});
function tick(now){const scene=document.querySelector('.scene');if(page==='Darstellung')scene.style.filter='brightness('+(0.4+values.Brightness/2.5)+')';$('.time').innerHTML='<span>'+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</span><small>'+new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:undefined})+'</small>';requestAnimationFrame(tick)}
applyLayout();if(!previewAutoOpen)$('.panel').classList.add('closed');render();requestAnimationFrame(tick);
function replayWelcome(){
 if($('.welcome-capsule'))$('.welcome-capsule').remove();
 const workspace=$('.workspace'),stages=[$('.time'),...document.querySelectorAll('.nav button'),$('.profile')];
 workspace.classList.add('welcome-loading');
 stages.forEach((node,i)=>{node.classList.add('intro-stage');node.style.setProperty('--intro-delay',i*150+'ms')});
 const welcome=document.createElement('div');welcome.className='welcome-capsule';welcome.textContent='Hey Lars';workspace.append(welcome);
 setTimeout(()=>{welcome.style.opacity=0;workspace.classList.add('welcome-revealing');workspace.classList.remove('welcome-loading');if(!reduced)stages.slice(1).forEach((node,i)=>setTimeout(()=>{if(workspace.classList.contains('welcome-revealing')&&!$('.dock').classList.contains('retracted'))uiTone('intro',.94+i*.025)},150*(i+1)));setTimeout(()=>welcome.remove(),350)},reduced?0:2800);
 setTimeout(()=>{workspace.classList.remove('welcome-loading','welcome-revealing');stages.forEach(node=>node.classList.remove('intro-stage'));welcome.remove()},reduced?0:4840);
}
replayWelcome();
// -- by Larsiopuw
</script></body></html>
