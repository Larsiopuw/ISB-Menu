:root{--bg:#e6e9ee;--panel:#f5f7fa;--card:#fff;--line:#d8dee6;--text:#202834;--muted:#667382;--accent:#e17027}
body{color:var(--text);background:#a3acb6;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.panel:not(.closed){visibility:visible;transition:opacity .24s,transform .32s cubic-bezier(.22,1,.36,1),visibility 0s}
.header{border-bottom:1px solid #dce2e880;height:55px}.header h1{flex:1;font-weight:650;letter-spacing:-.35px}.header svg{color:var(--accent)}

.time{font-size:12px;color:#566375}.nav button{background:transparent;color:#6b7989}.nav button:hover{background:#ffffff90;color:#313e4f;transform:translateY(-3px) scale(1.06)}.nav button.selected{background:#e1702715;color:var(--accent)}

.nav button:hover span.nav-tooltip{visibility:visible;transition-delay:.12s,.12s,0s}.nav-tooltip svg{color:var(--accent)}.nav-tooltip small{color:var(--muted)}

ion='';render()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>document.documentElement.style.setProperty('--accent',b.dataset.theme));document.querySelectorAll('[data-motion]').forEach(b=>b.onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduce',reduced);toast(reduced?'Animationen reduziert.':'Animationen aktiviert.')});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>toast('Einstellungen gespeichert.'));document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{capturePreviewKey=true;b.textContent='Taste drücken …';window.addEventListener('keydown',e=>{e.preventDefault();capturePreviewKey=false;if(e.key!=='Escape'){if(Object.entries(bindings).some(([name,key])=>name!==b.dataset.key&&key===e.code)){toast('Diese Taste wird bereits verwendet.');b.textContent=bindings[b.dataset.key];return}bindings[b.dataset.key]=e.code}b.textContent=bindings[b.dataset.key]},{once:true})});document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>{const id=$('[aria-label="Audio-ID"]').value;if(!/^\d{1,18}$/.test(id)){toast('Numerische Audio-ID eingeben.');return}queue.push(id);render();toast('Zur Vorschau-Warteschlange hinzugefügt. Es wird kein Audio abgespielt.')});document.querySelectorAll('[data-stopwatch]').forEach(b=>b.onclick=()=>{activity={value:0,running:true,mode:'stopwatch'};$('.island').style.display='flex'});document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{const n=+$('#minutes').value;if(!Number.isFinite(n)||n<.1||n>180){toast('0,1 bis 180 Minuten eingeben.');return}activity={value:n*60,running:true,mode:'timer'};$('.island').style.display='flex'});}
names.forEach((name,i)=>{const b=document.createElement('button');b.ariaLabel=name;b.innerHTML=icon(navIcons[i])+`<span class="nav-tooltip">${icon(navIcons[i])}<div><b>${name}</b><small>${navDescriptions[i]}</small></div></span>`;b.onclick=()=>switchPage(name);$('.nav').append(b)});$('#search-icon').innerHTML=icon('magnifying-glass');$('.search input').oninput=()=>{selectedScript='';render()};document.querySelectorAll('.window-button,.launcher').forEach(b=>b.onclick=()=>$('.panel').classList.toggle('closed'));$('#activity-pause').innerHTML=icon('pause');$('#activity-pause').onclick=()=>{activity.running=!activity.running;$('#activity-pause').innerHTML=icon(activity.running?'pause':'play')};$('#activity-close').onclick=()=>{activity.running=false;$('.island').style.display='none'};$('.profile').onclick=()=>switchPage('Profil');const bindings={key:'KeyM',dockKey:'KeyK',searchKey:'KeyT'};
let audioContext,capturePreviewKey=false;
function uiTone(kind){try{audioContext||=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();const now=audioContext.currentTime,duration=kind==='tap'?.055:kind==='close'?.12:.16,freqs=kind==='tap'?[1500,2100]:kind==='close'?[660,440]:[880,1320];freqs.forEach((f,i)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.frequency.value=f;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(i===0?.035:.012,now+.006);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(now);oscillator.stop(now+duration)})}catch{}}
function quickOpen(value){$('.workspace').classList.toggle('searching',value);$('#quick-overlay').hidden=!value;if(value){uiTone('open');document.querySelectorAll('[data-quick-provider]').forEach(b=>b.classList.toggle('active',b.dataset.quickProvider===provider));$('#quick-input').focus()}else{uiTone('close');$('#quick-input').blur()}}
$('#quick-icon').innerHTML=icon('magnifying-glass');$('#quick-close').onclick=()=>quickOpen(false);document.querySelectorAll('[data-quick-provider]').forEach(b=>b.onclick=()=>{provider=b.dataset.quickProvider;document.querySelectorAll('[data-quick-provider]').forEach(p=>p.classList.toggle('active',p.dataset.quickProvider===provider));$('#quick-input').focus()});$('#quick-input').onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q.length<2){toast('Mindestens zwei Zeichen eingeben.');return}quickOpen(false);page='Skripte';$('.search input').value=q;selectedScript='';localMode=false;render();$('.panel').classList.remove('closed')}};
document.addEventListener('click',e=>{if(e.target.closest('button'))uiTone('tap')});window.addEventListener('keydown',e=>{if(capturePreviewKey)return;if(e.code==='Escape'&&!$('#quick-overlay').hidden){e.preventDefault();quickOpen(false);return}if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.code===bindings.key){e.preventDefault();const closing=!$('.panel').classList.contains('closed');$('.panel').classList.toggle('closed');uiTone(closing?'close':'open')}else if(e.code===bindings.dockKey){e.preventDefault();$('.dock').classList.toggle('retracted');uiTone($('.dock').classList.contains('retracted')?'close':'open')}else if(e.code===bindings.searchKey){e.preventDefault();quickOpen($('#quick-overlay').hidden)}});
function tick(now){const dt=(now-last)/1000;last=now;if(activity.running){activity.value+=activity.mode==='timer'?-dt:dt;if(activity.value<=0){activity.value=0;activity.running=false;toast('Timer abgelaufen.')}}const n=Math.max(0,activity.value);$('#activity-value').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n)%60).padStart(2,'0');$('#activity-label').textContent=activity.mode==='timer'?'TIMER':'STOPPUHR';$('.time').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
